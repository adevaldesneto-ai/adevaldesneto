<!doctype html>
<html
  lang="pt-BR"
  data-resolution="landscape"
  data-composition-variables='[{"id":"titulo","type":"string","label":"Título","default":"Uma Viagem pelo Universo"},{"id":"legenda","type":"string","label":"Legenda","default":"Olá, exploradores e exploradoras!"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #070b1f;
        --ink: #fff8e7;
        --gold: #ffcf5a;
        --font-display: "Nunito", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      #titulo-box { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 150px; }
      #titulo {
        color: var(--ink);
        font-size: 112px;
        font-weight: 900;
        letter-spacing: -0.01em;
        text-align: center;
        text-shadow: 0 6px 0 rgba(160, 60, 20, 0.55), 0 0 40px rgba(255, 190, 90, 0.55), 0 0 90px rgba(120, 140, 255, 0.45);
      }
      #legenda-box { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 120px; }
      #legenda {
        color: #fff;
        font-size: 54px;
        font-weight: 800;
        padding: 14px 34px;
        border-radius: 18px;
        background: rgba(8, 10, 30, 0.62);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.8" data-width="1920" data-height="1080">
      <div
        id="quintal"
        data-composition-id="quintal"
        data-composition-src="compositions/quintal.html"
        data-start="0"
        data-duration="7.8"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div id="titulo-box" class="clip" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" style="z-index: 2">
        <h1 id="titulo" data-var-text="titulo">Uma Viagem pelo Universo</h1>
      </div>
      <div id="legenda-box" class="clip" data-start="5" data-duration="2.8" data-track-index="2" data-track-kind="captions" style="z-index: 3">
        <p id="legenda" data-var-text="legenda">Olá, exploradores e exploradoras!</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // title: rises in softly, holds, drifts out before the line
      tl.fromTo("#titulo", { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "back.out(1.6)" }, 0.4);
      tl.to("#titulo", { y: -8, duration: 3.0, ease: "sine.inOut" }, 1.3);
      tl.to("#titulo", { opacity: 0, y: -40, duration: 0.6, ease: "power2.in" }, 4.3);
      // caption with the first narration line
      tl.fromTo("#legenda", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 5.0);
      tl.to("#legenda", { opacity: 0, duration: 0.3, ease: "power1.in" }, 7.45);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
