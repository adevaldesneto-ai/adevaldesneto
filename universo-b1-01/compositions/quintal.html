      tl.fromTo("#st" + i, { opacity: 0.15 + 0.3 * p, scale: 0.7 }, { opacity: 1, scale: 1.25, duration: dur, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, reps) }, p * 0.8);
